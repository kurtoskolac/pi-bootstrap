---
- name: Enable lingering so user services run without a login session
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user_id }}"
  args:
    creates: "/var/lib/systemd/linger/{{ ansible_user_id }}"
  become: true

- name: Create systemd and Quadlet directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_user_dir }}/.config/containers/systemd"
    - "{{ ansible_user_dir }}/.config/systemd/user"

# No mode on purpose: rootless Podman (the :U volume option) chowns these to a
# mapped sub-UID, so chmod from the host user fails with EPERM. Only ensure they exist.
- name: Create data directories for containers  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/{{ item }}"
    state: directory
  loop: "{{ quadlets_data_dirs }}"

- name: Install homelab.target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../systemd/homelab.target"
    dest: "{{ ansible_user_dir }}/.config/systemd/user/homelab.target"
    mode: "0644"
  notify: Reload user systemd

- name: Install Quadlet units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ansible_user_dir }}/.config/containers/systemd/{{ item | basename }}"
    mode: "0644"
  with_fileglob:
    - "{{ playbook_dir }}/../quadlets/*.container"
  notify: Reload user systemd

- name: Apply pending systemd reload before starting anything
  ansible.builtin.meta: flush_handlers

- name: Enable and start the homelab target
  ansible.builtin.systemd:
    name: homelab.target
    scope: user
    enabled: true
    state: started
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"

# dufs.env holds the file-server password and is created by hand on the Pi
# (it is never committed, see quadlets/dufs.env.example). Keep it readable by
# the owner only. Skipped when the file doesn't exist yet.
- name: Check whether the dufs env file exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/filebrowser/dufs.env"
  register: quadlets_dufs_env

- name: Restrict dufs env file to owner only
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/filebrowser/dufs.env"
    mode: "0600"
  when: quadlets_dufs_env.stat.exists
