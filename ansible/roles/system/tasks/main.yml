---
- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"
  become: true

- name: Cap the journal size to spare the SD card
  ansible.builtin.copy:
    src: journald-sdcard.conf
    dest: /etc/systemd/journald.conf.d/10-sdcard.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart journald

# Cleans up a legacy manual setup where WiFi power-save was disabled.
# Since WiFi is disabled via dtoverlay, this service fails every boot with "No such device".
- name: Check if legacy wifi-powersave-off.service exists
  ansible.builtin.stat:
    path: /etc/systemd/system/wifi-powersave-off.service
  register: system_wifi_powersave_file

- name: Disable broken wifi-powersave-off.service
  ansible.builtin.systemd:
    name: wifi-powersave-off.service
    enabled: false
    state: stopped
  become: true
  when: system_wifi_powersave_file.stat.exists
  changed_when: false

- name: Remove broken wifi-powersave-off.service file
  ansible.builtin.file:
    path: /etc/systemd/system/wifi-powersave-off.service
    state: absent
  become: true
  when: system_wifi_powersave_file.stat.exists
  notify: Reload systemd

- name: Disable HDMI output to save power
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^hdmi_blanking='
    line: 'hdmi_blanking=2'
    state: present
