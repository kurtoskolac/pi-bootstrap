---
- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"
  become: true

- name: Cap the journal size to spare the SD card
  ansible.builtin.copy:
    src: journald-sdcard.conf
    dest: /etc/systemd/journald.conf.d/10-sdcard.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart journald
